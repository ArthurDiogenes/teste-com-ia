<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Presenças</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Minhas Presenças</h1>
  </header>

  <main>
    <form id="form-aluno">
      <label for="aluno-nome">Digite seu nome:</label>
      <input type="text" id="aluno-nome" required />
      <button type="submit">Verificar</button>
    </form>

    <section id="resultado" hidden>
      <h2>Resultado</h2>
      <p id="percentual"></p>
      <ul id="lista-datas"></ul>
    </section>
  </main>

  <footer>
    <p>Aplicação de Presenças - v1.0</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.5/dist/umd/supabase.min.js"></script>
  <script src="config/supabase.js"></script>
  <script src="js/aluno.js"></script>
</body>
</html>
